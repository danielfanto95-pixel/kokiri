<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokiri OS — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c120d; --surface: #121a13; --border: rgba(163,214,140,0.14);
  --text: #e4ede0; --muted: #9db396; --leaf: #7cc576; --leaf-bright: #a8e79f;
  --error: #f87171; --success: #93d99a;
  --heading: 'Cinzel', serif; --body: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  background-image: radial-gradient(ellipse 60% 50% at 50% -10%, rgba(124,197,118,0.14) 0%, transparent 60%);
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
h1 { font-family: var(--heading); font-weight: 800; font-size: 1.5rem; color: var(--leaf-bright); margin-bottom: 0.3rem; }
.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.75rem; }
label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; margin-top: 1rem; }
input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.7rem 0.9rem; color: var(--text); font-size: 0.95rem; font-family: inherit;
}
input:focus { outline: none; border-color: var(--leaf); }
button {
  width: 100%; border: none; border-radius: 8px; padding: 0.75rem; font-weight: 700; font-size: 0.9rem;
  cursor: pointer; font-family: inherit; background: var(--leaf); color: #0c120d; margin-top: 1.5rem;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { margin-top: 1rem; font-size: 0.85rem; padding: 0.6rem 0.8rem; border-radius: 6px; display: none; }
.msg.error { background: rgba(248,113,113,0.1); color: var(--error); display: block; }
.msg.success { background: rgba(147,217,154,0.1); color: var(--success); display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Kokiri OS</h1>
  <p class="sub" id="sub-text">Set a new password.</p>
  <form id="reset-form">
    <label for="password">New Password</label>
    <input type="password" id="password" required autocomplete="new-password" minlength="6">
    <label for="password2">Confirm New Password</label>
    <input type="password" id="password2" required autocomplete="new-password" minlength="6">
    <button type="submit" id="btn-reset">Set New Password</button>
  </form>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://qahriykfwknuoqctsaek.supabase.co', 'sb_publishable_nPF5goHAWj0iAiUOnhnXPA_8qd3b2mU');

  const form = document.getElementById('reset-form');
  const msg = document.getElementById('msg');
  const btnReset = document.getElementById('btn-reset');
  const subText = document.getElementById('sub-text');

  function showMsg(text, type) { msg.textContent = text; msg.className = 'msg ' + type; }

  // Supabase parses the recovery token from the URL fragment on load and turns it into a real session.
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    subText.textContent = 'This reset link is invalid or has expired.';
    showMsg('Request a new link from the login page.', 'error');
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) { showMsg('Passwords don\'t match.', 'error'); return; }
    btnReset.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: p1 });
    btnReset.disabled = false;
    if (error) { showMsg(error.message, 'error'); return; }
    showMsg('Password updated — redirecting to login…', 'success');
    await supabase.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  });
</script>

</body>
</html>
