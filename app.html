<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokiri OS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c120d; --surface: #121a13; --surface2: #17201a;
  --border: rgba(163,214,140,0.14); --border-bright: rgba(163,214,140,0.32);
  --text: #e4ede0; --muted: #9db396; --dim: #6b8065;
  --leaf: #7cc576; --leaf-bright: #a8e79f; --gold: #e6c068;
  --heading: 'Cinzel', serif; --body: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 1.5rem; padding: 0.9rem 1.5rem; position: relative;
  border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10;
}
.brand {
  font-family: var(--heading); font-weight: 800; color: var(--leaf-bright); font-size: 1.1rem; white-space: nowrap;
  position: absolute; left: 50%; transform: translateX(-50%); text-decoration: none; transition: color 0.15s;
}
.brand:hover { color: var(--gold); }
#btn-logout {
  margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.78rem; white-space: nowrap;
}
#btn-logout:hover { border-color: var(--leaf); color: var(--text); }

.layout { display: flex; min-height: calc(100vh - 57px); }
main { flex: 1; padding: 1.5rem; min-width: 0; }
.sheet-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
.sheet-head h2 { font-family: var(--heading); font-size: 1.3rem; color: var(--leaf-bright); }
.action-btn {
  font-family: var(--mono); font-size: 0.75rem; color: var(--text); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer;
}
.action-btn:hover { border-color: var(--leaf); }

.grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: max-content; }
th, td {
  border: 1px solid var(--border); padding: 0.55rem 0.75rem; text-align: left;
  font-size: 0.82rem; vertical-align: top; max-width: 320px;
}
th {
  background: var(--surface2); font-family: var(--mono); font-weight: 600; color: var(--leaf-bright);
  white-space: nowrap; position: sticky; top: 0;
}
td { background: var(--surface); color: var(--text); min-width: 160px; }
td[contenteditable="true"]:focus { outline: 2px solid var(--leaf); outline-offset: -2px; background: var(--surface2); }
.row-del { color: var(--dim); cursor: pointer; font-family: var(--mono); font-size: 0.72rem; text-align: center; width: 30px; }
.row-del:hover { color: #f87171; }
.empty-note { color: var(--muted); font-size: 0.85rem; padding: 2rem; text-align: center; }

/* Right-hand global nav */
.nav-side {
  width: 230px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface);
  padding: 1.2rem 0.9rem; overflow-y: auto; position: sticky; top: 57px; height: calc(100vh - 57px);
}
.nav-group { margin-bottom: 0.3rem; }
.nav-group-label {
  font-family: var(--mono); font-size: 0.68rem; color: var(--dim); letter-spacing: 0.12em;
  text-transform: uppercase; margin: 1.1rem 0.4rem 0.5rem; cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between; padding: 0.15rem 0;
}
.nav-group:first-child .nav-group-label { margin-top: 0; }
.nav-group-label .chevron { transition: transform 0.15s; font-size: 0.6rem; }
.nav-group-label.collapsed .chevron { transform: rotate(-90deg); }
.nav-group-content { overflow: hidden; }
.nav-group-content.collapsed { display: none; }
.nav-link {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; border-radius: 7px;
  cursor: pointer; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.15rem; border: 1px solid transparent;
  text-decoration: none;
}
.nav-link:hover { background: var(--surface2); color: var(--text); }
.nav-link.active { background: var(--surface2); border-color: var(--border-bright); color: var(--leaf-bright); font-weight: 600; }
.nav-link .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--leaf); flex-shrink: 0; opacity: 0.6; }
@media (max-width: 900px) { .nav-side { display: none; } }
</style>
</head>
<body>

<div class="topbar">
  <a href="home.html" class="brand">Kokiri OS</a>
  <button id="btn-logout">Log Out</button>
</div>

<div class="layout">
  <main>
    <div class="sheet-head">
      <h2 id="sheet-title">Loading…</h2>
      <button class="action-btn" id="btn-add-row">+ Add Row</button>
      <button class="action-btn" id="btn-add-col">+ Add Column</button>
    </div>
    <div class="grid-wrap"><table id="grid"></table></div>
  </main>

  <nav class="nav-side">
    <div class="nav-group">
      <div class="nav-group-label" data-group="Kokiri">Kokiri<span class="chevron">▾</span></div>
      <div class="nav-group-content" id="nav-sheets"></div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" data-group="Agents">Agents<span class="chevron">▾</span></div>
      <div class="nav-group-content" id="nav-agents"></div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" data-group="Dashboards">Dashboards<span class="chevron">▾</span></div>
      <div class="nav-group-content" id="nav-dashboards"></div>
    </div>
  </nav>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://qahriykfwknuoqctsaek.supabase.co', 'sb_publishable_nPF5goHAWj0iAiUOnhnXPA_8qd3b2mU');

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = 'login.html';

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  let sheets = [];
  let currentSheet = null;
  let currentColumns = [];
  let currentRows = [];

  async function loadNav() {
    const [{ data: sheetData }, { data: agentData }, { data: dashData }] = await Promise.all([
      supabase.from('kokiri_sheets').select('*').order('sort_order'),
      supabase.from('agents').select('id, name, icon').order('sort_order'),
      supabase.from('dashboards').select('id, name, icon').order('sort_order'),
    ]);
    sheets = sheetData || [];

    const navSheets = document.getElementById('nav-sheets');
    navSheets.innerHTML = sheets.map(s => `<div class="nav-link" data-slug="${s.slug}"><span class="dot"></span>${escapeHtml(s.name)}</div>`).join('');
    navSheets.querySelectorAll('.nav-link').forEach(el => el.addEventListener('click', () => selectSheet(el.dataset.slug)));

    const navAgents = document.getElementById('nav-agents');
    navAgents.innerHTML = (agentData || []).map(a => `<a class="nav-link" href="agents.html#${a.id}">${a.icon || '⚔️'} ${escapeHtml(a.name)}</a>`).join('')
      + `<a class="nav-link" href="agents.html" style="color:var(--gold);">→ Open Dashboard</a>`;

    const navDashboards = document.getElementById('nav-dashboards');
    navDashboards.innerHTML = (dashData || []).map(d => `<a class="nav-link" href="dashboards.html#${d.id}">${d.icon || '📊'} ${escapeHtml(d.name)}</a>`).join('');

    const hashSlug = window.location.hash.replace('#', '');
    const initial = sheets.find(s => s.slug === hashSlug) || sheets[0];
    if (initial) selectSheet(initial.slug);
  }

  async function selectSheet(slug) {
    currentSheet = sheets.find(s => s.slug === slug);
    if (!currentSheet) return;
    window.location.hash = slug;
    document.querySelectorAll('#nav-sheets .nav-link').forEach(b => b.classList.toggle('active', b.dataset.slug === slug));
    document.getElementById('sheet-title').textContent = currentSheet.name;

    const [{ data: cols }, { data: rows }] = await Promise.all([
      supabase.from('kokiri_columns').select('*').eq('sheet_id', currentSheet.id).order('sort_order'),
      supabase.from('kokiri_rows').select('*').eq('sheet_id', currentSheet.id).order('sort_order'),
    ]);
    currentColumns = cols || [];
    currentRows = rows || [];
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    if (currentColumns.length === 0) {
      grid.innerHTML = '';
      document.querySelector('.grid-wrap').innerHTML = '<p class="empty-note">No columns yet — click "+ Add Column" to start building this sheet.</p><table id="grid"></table>';
      return;
    }
    let html = '<thead><tr><th class="row-del">×</th>';
    for (const c of currentColumns) html += `<th>${escapeHtml(c.name)}</th>`;
    html += '</tr></thead><tbody>';
    for (const r of currentRows) {
      html += `<tr data-row-id="${r.id}"><td class="row-del" data-action="del-row">×</td>`;
      for (const c of currentColumns) {
        const val = r.data?.[c.column_key] ?? '';
        html += `<td contenteditable="true" data-col-key="${c.column_key}">${escapeHtml(val)}</td>`;
      }
      html += '</tr>';
    }
    html += '</tbody>';
    document.querySelector('.grid-wrap').innerHTML = `<table id="grid">${html}</table>`;
    attachGridHandlers();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function attachGridHandlers() {
    document.querySelectorAll('td[contenteditable="true"]').forEach(td => {
      td.addEventListener('blur', async () => {
        const tr = td.closest('tr');
        const rowId = tr.dataset.rowId;
        const colKey = td.dataset.colKey;
        const newVal = td.textContent;
        const row = currentRows.find(r => r.id === rowId);
        if (!row) return;
        row.data = { ...row.data, [colKey]: newVal };
        await supabase.from('kokiri_rows').update({ data: row.data, updated_at: new Date().toISOString() }).eq('id', rowId);
      });
    });
    document.querySelectorAll('[data-action="del-row"]').forEach(el => {
      el.addEventListener('click', async () => {
        const tr = el.closest('tr');
        const rowId = tr.dataset.rowId;
        if (!confirm('Delete this row?')) return;
        await supabase.from('kokiri_rows').delete().eq('id', rowId);
        currentRows = currentRows.filter(r => r.id !== rowId);
        renderGrid();
      });
    });
  }

  document.getElementById('btn-add-row').addEventListener('click', async () => {
    if (!currentSheet) return;
    const maxOrder = currentRows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
    const { data, error } = await supabase.from('kokiri_rows')
      .insert({ sheet_id: currentSheet.id, data: {}, sort_order: maxOrder + 1 })
      .select().single();
    if (error) { alert(error.message); return; }
    currentRows.push(data);
    renderGrid();
  });

  document.getElementById('btn-add-col').addEventListener('click', async () => {
    if (!currentSheet) return;
    const name = prompt('New column name:');
    if (!name) return;
    const key = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || ('col_' + Date.now());
    const maxOrder = currentColumns.reduce((m, c) => Math.max(m, c.sort_order || 0), 0);
    const { data, error } = await supabase.from('kokiri_columns')
      .insert({ sheet_id: currentSheet.id, column_key: key, name, sort_order: maxOrder + 1 })
      .select().single();
    if (error) { alert(error.message); return; }
    currentColumns.push(data);
    renderGrid();
  });

  // ---------- Collapsible nav groups (state persisted across pages) ----------
  function initNavCollapse() {
    const stored = JSON.parse(localStorage.getItem('kokiri_nav_collapsed') || '{}');
    document.querySelectorAll('.nav-group-label[data-group]').forEach(label => {
      const group = label.dataset.group;
      const content = label.nextElementSibling;
      if (stored[group]) { label.classList.add('collapsed'); content.classList.add('collapsed'); }
      label.addEventListener('click', () => {
        const isCollapsed = label.classList.toggle('collapsed');
        content.classList.toggle('collapsed', isCollapsed);
        const s = JSON.parse(localStorage.getItem('kokiri_nav_collapsed') || '{}');
        s[group] = isCollapsed;
        localStorage.setItem('kokiri_nav_collapsed', JSON.stringify(s));
      });
    });
  }
  initNavCollapse();

  loadNav();
</script>

</body>
</html>
