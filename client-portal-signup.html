<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Furin Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c120d; --surface: #121a13; --text: #e4ede0; --muted: #9db396;
  --leaf: #7cc576; --leaf-bright: #a8e79f; --heading: 'Cinzel', serif; --body: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem 1.5rem; text-align: center; }
.wrap { max-width: 520px; }
.icon { font-size: 2.6rem; margin-bottom: 0.8rem; }
h1 { font-family: var(--heading); font-size: 1.7rem; color: var(--leaf-bright); margin-bottom: 0.8rem; }
p { color: var(--muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 1.6rem; }
a.btn { display: inline-block; background: var(--leaf-bright); color: var(--bg); text-decoration: none; font-weight: 700; border-radius: 8px; padding: 0.8rem 1.8rem; font-size: 0.95rem; }
.footer { margin-top: 2rem; font-size: 0.78rem; }
.footer a { color: var(--leaf); }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">💪</div>
  <h1>Join Furin Fitness</h1>
  <p>Fill out this quick onboarding questionnaire — it covers your intake info and waiver. Once submitted, your coach will review and set up your Client Portal access (you'll get a login by email).</p>
  <a class="btn" href="https://form.jotform.com/262333676669066" target="_blank">Start Onboarding →</a>
  <div class="footer">Already have access? <a href="login.html">Log in here</a> · <a href="privacy-policy.html">Privacy Policy</a></div>
</div>
</body>
</html>
