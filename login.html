<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokiri OS — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c120d; --surface: #121a13; --border: rgba(163,214,140,0.14);
  --text: #e4ede0; --muted: #9db396; --leaf: #7cc576; --leaf-bright: #a8e79f;
  --error: #f87171; --success: #93d99a;
  --heading: 'Cinzel', serif; --body: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  background-image: radial-gradient(ellipse 60% 50% at 50% -10%, rgba(124,197,118,0.14) 0%, transparent 60%);
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
h1 { font-family: var(--heading); font-weight: 800; font-size: 1.5rem; color: var(--leaf-bright); margin-bottom: 0.3rem; }
.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.75rem; }
label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; margin-top: 1rem; }
input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.7rem 0.9rem; color: var(--text); font-size: 0.95rem; font-family: inherit;
}
input:focus { outline: none; border-color: var(--leaf); }
.btn-row { display: flex; gap: 0.6rem; margin-top: 1.5rem; }
button {
  flex: 1; border: none; border-radius: 8px; padding: 0.75rem; font-weight: 700; font-size: 0.9rem;
  cursor: pointer; font-family: inherit;
}
#btn-login { background: var(--leaf); color: #0c120d; }
#btn-signup { background: transparent; color: var(--text); border: 1px solid var(--border); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { margin-top: 1rem; font-size: 0.85rem; padding: 0.6rem 0.8rem; border-radius: 6px; display: none; }
.msg.error { background: rgba(248,113,113,0.1); color: var(--error); display: block; }
.msg.success { background: rgba(147,217,154,0.1); color: var(--success); display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Kokiri OS</h1>
  <p class="sub">Sign in, or create your account the first time.</p>
  <form id="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" minlength="6">
    <div class="btn-row">
      <button type="submit" id="btn-login">Log In</button>
      <button type="button" id="btn-signup">Sign Up</button>
    </div>
  </form>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://qahriykfwknuoqctsaek.supabase.co', 'sb_publishable_nPF5goHAWj0iAiUOnhnXPA_8qd3b2mU');

  const form = document.getElementById('auth-form');
  const msg = document.getElementById('msg');
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const btnLogin = document.getElementById('btn-login');
  const btnSignup = document.getElementById('btn-signup');

  function showMsg(text, type) { msg.textContent = text; msg.className = 'msg ' + type; }
  function setLoading(v) { btnLogin.disabled = v; btnSignup.disabled = v; }

  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'home.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setLoading(true);
    const { error } = await supabase.auth.signInWithPassword({ email: emailEl.value, password: passEl.value });
    setLoading(false);
    if (error) showMsg(error.message, 'error');
    else window.location.href = 'home.html';
  });

  btnSignup.addEventListener('click', async () => {
    if (!emailEl.value || !passEl.value) { showMsg('Enter an email and password first.', 'error'); return; }
    setLoading(true);
    const { data, error } = await supabase.auth.signUp({ email: emailEl.value, password: passEl.value });
    setLoading(false);
    if (error) showMsg(error.message, 'error');
    else if (data.session) window.location.href = 'home.html';
    else showMsg('Account created — check your email to confirm, then log in.', 'success');
  });
</script>

</body>
</html>
