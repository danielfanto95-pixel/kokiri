<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokiri — Connecting…</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c120d; --surface: #121a13; --border: rgba(163,214,140,0.14); --border-bright: rgba(163,214,140,0.32);
  --text: #e4ede0; --muted: #9db396; --leaf: #7cc576; --leaf-bright: #a8e79f;
  --heading: 'Cinzel', serif; --body: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 2rem;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2.5rem;
  max-width: 440px; width: 100%; text-align: center;
}
h1 { font-family: var(--heading); font-size: 1.2rem; color: var(--leaf-bright); margin-bottom: 1rem; }
p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1rem; }
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--leaf); border-radius: 50%;
  margin: 0 auto 1.2rem; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: #e08a8a; font-family: var(--mono); font-size: 0.8rem; background: rgba(224,138,138,0.08); border: 1px solid rgba(224,138,138,0.3); border-radius: 8px; padding: 0.8rem; text-align: left; word-break: break-word; }
a.btn { display: inline-block; margin-top: 0.5rem; background: var(--leaf); color: #0c120d; text-decoration: none; font-family: var(--heading); font-weight: 700; font-size: 0.85rem; padding: 0.6rem 1.3rem; border-radius: 8px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Connecting…</h1>
  <p>Finishing the authorization with the MCP server.</p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://qahriykfwknuoqctsaek.supabase.co', 'sb_publishable_nPF5goHAWj0iAiUOnhnXPA_8qd3b2mU');

  const card = document.getElementById('card');
  function show(html) { card.innerHTML = html; }

  async function run() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      show(`<h1>⚠ Not logged in</h1><p>Log in to Kokiri first, then retry connecting this MCP server.</p><a class="btn" href="login.html">Log In</a>`);
      return;
    }

    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');
    const errorParam = params.get('error');

    if (errorParam) {
      show(`<h1>⚠ Authorization declined</h1><p>The provider returned: <span class="err">${errorParam}${params.get('error_description') ? ' — ' + params.get('error_description') : ''}</span></p><a class="btn" href="agents.html">Back to Agent Dashboard</a>`);
      return;
    }
    if (!code || !state) {
      show(`<h1>⚠ Missing authorization code</h1><p>This page is meant to be reached via an OAuth redirect from an MCP server, not visited directly.</p><a class="btn" href="agents.html">Back to Agent Dashboard</a>`);
      return;
    }

    try {
      const res = await fetch('https://qahriykfwknuoqctsaek.supabase.co/functions/v1/mcp-oauth-callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ code, state }),
      });
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error || 'Connection failed.');
      show(`<h1>✓ Connected</h1><p><strong style="color:var(--leaf-bright);">${json.server_name}</strong> is now connected. Its tools will load next time an agent needs them.</p><a class="btn" href="agents.html">Back to Agent Dashboard</a>`);
    } catch (e) {
      show(`<h1>⚠ Connection failed</h1><p>The token exchange didn't go through:</p><div class="err">${e.message}</div><p style="margin-top:1rem;">Double-check the Client ID/Secret and Authorize/Token URLs for this server in Settings, then try again.</p><a class="btn" href="agents.html">Back to Agent Dashboard</a>`);
    }
  }

  run();
</script>
</body>
</html>
